[tools]
"conda:git" = "latest"

[tasks.setup]
description = "Install or update my tmux configuration"
run = '''
#!/usr/bin/env bash
set -euo pipefail
installer="$(mktemp)"
trap 'rm -f "$installer"' EXIT
curl -fsSL https://raw.githubusercontent.com/Mrchazaaa/tmux-config/master/install.sh -o "$installer"
bash "$installer"
'''
